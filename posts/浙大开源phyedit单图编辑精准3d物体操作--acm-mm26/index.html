<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="浙江大学ReLER团队开源PhyEdit，推动图像生成模型从“会创作”迈向“可操作”。该方法融合现有3D基础模型精准建模目标几何结构，再由先进DiT图像编辑器完成高质量渲染。实验证明，PhyEdit支持对单张图像中物体进行真实感三维空间编辑：可调整深度（如近处移至远处）、穿越遮挡、沿用户指定三维轨迹连续运动，显著提升图像编辑的空间可控性与物理一致性。（150字）"><link rel="icon" type="image/svg+xml" href="/D-Ai-ly/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"><title>浙大开源PhyEdit：单图编辑+精准3D物体操作 | ACM MM&#39;26 · D-Ai-ly</title><link rel="stylesheet" href="/D-Ai-ly/_astro/about.BBP58Tfa.css"></head> <body> <div class="site-shell"> <header class="site-header"> <a class="brand" href="/D-Ai-ly/">D-Ai-ly</a> <nav class="nav" aria-label="主导航"> <a href="/D-Ai-ly/">首页</a> <a href="/D-Ai-ly/about/">关于</a> </nav> </header> <main>  <article class="prose"> <h1 class="page-title">浙大开源PhyEdit：单图编辑+精准3D物体操作 | ACM MM&#39;26</h1> <div class="meta"> <span class="pill">智源社区</span> <span>2026-08-19</span> <a href="/D-Ai-ly/sources/baai/">来源归档</a> </div> <p class="excerpt" style="margin-top: 1.25rem;">浙江大学ReLER团队开源PhyEdit，推动图像生成模型从“会创作”迈向“可操作”。该方法融合现有3D基础模型精准建模目标几何结构，再由先进DiT图像编辑器完成高质量渲染。实验证明，PhyEdit支持对单张图像中物体进行真实感三维空间编辑：可调整深度（如近处移至远处）、穿越遮挡、沿用户指定三维轨迹连续运动，显著提升图像编辑的空间可控性与物理一致性。（150字）</p> <a class="cta" href="https://hub.baai.ac.cn/view/57241" target="_blank" rel="noopener noreferrer">
