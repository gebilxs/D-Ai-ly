<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="机器人身体是具身智能中被严重低估的关键变量。近两年人形机器人备受资本与人才青睐，因其人体尺度适配现实世界——双腿越障、双臂操作、双手使用现有工具，可直接融入工厂、仓库、商店及家庭等人类基础设施。然而，追求通用性也放大了技术难点：运动控制、环境适应、多模态感知与实时决策高度耦合，远超单一算法突破范畴。身体不再是被动载体，而是智能涌现的物理基底，亟需跨学科协同攻关。（150字）"><link rel="icon" type="image/svg+xml" href="/D-Ai-ly/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"><title>人形之外，擎羽把“身体”变成具身智能的新变量 · D-Ai-ly</title><link rel="stylesheet" href="/D-Ai-ly/_astro/about.BBP58Tfa.css"></head> <body> <div class="site-shell"> <header class="site-header"> <a class="brand" href="/D-Ai-ly/">D-Ai-ly</a> <nav class="nav" aria-label="主导航"> <a href="/D-Ai-ly/">首页</a> <a href="/D-Ai-ly/about/">关于</a> </nav> </header> <main>  <article class="prose"> <h1 class="page-title">人形之外，擎羽把“身体”变成具身智能的新变量</h1> <div class="meta"> <span class="pill">智源社区</span> <span>2026-08-15</span> <a href="/D-Ai-ly/sources/baai/">来源归档</a> </div> <p class="excerpt" style="margin-top: 1.25rem;">机器人身体是具身智能中被严重低估的关键变量。近两年人形机器人备受资本与人才青睐，因其人体尺度适配现实世界——双腿越障、双臂操作、双手使用现有工具，可直接融入工厂、仓库、商店及家庭等人类基础设施。然而，追求通用性也放大了技术难点：运动控制、环境适应、多模态感知与实时决策高度耦合，远超单一算法突破范畴。身体不再是被动载体，而是智能涌现的物理基底，亟需跨学科协同攻关。（150字）</p> <a class="cta" href="https://hub.baai.ac.cn/view/57132" target="_blank" rel="noopener noreferrer">
