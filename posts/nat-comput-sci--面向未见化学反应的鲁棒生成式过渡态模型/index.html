<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="过渡态决定化学反应速率与路径，其精准预测是计算化学核心挑战。近年生成式机器学习在小型有机反应中表现优异，但模型多训练于H、C、N、O等常见元素，对训练未见的新元素、过渡金属及新型催化环境的泛化能力缺乏系统评估。为此，研究人员构建了分布外过渡态新基准，并以Transition1x为基础开展验证，旨在全面检验模型在未知化学空间中的可靠性与鲁棒性，推动更普适、可迁移的过渡态预测方法发展。"><link rel="icon" type="image/svg+xml" href="/D-Ai-ly/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"><title>Nat. Comput. Sci. | 面向未见化学反应的鲁棒生成式过渡态模型 · D-Ai-ly</title><link rel="stylesheet" href="/D-Ai-ly/_astro/about.BBP58Tfa.css"></head> <body> <div class="site-shell"> <header class="site-header"> <a class="brand" href="/D-Ai-ly/">D-Ai-ly</a> <nav class="nav" aria-label="主导航"> <a href="/D-Ai-ly/">首页</a> <a href="/D-Ai-ly/about/">关于</a> </nav> </header> <main>  <article class="prose"> <h1 class="page-title">Nat. Comput. Sci. | 面向未见化学反应的鲁棒生成式过渡态模型</h1> <div class="meta"> <span class="pill">智源社区</span> <span>2026-08-16</span> <a href="/D-Ai-ly/sources/baai/">来源归档</a> </div> <p class="excerpt" style="margin-top: 1.25rem;">过渡态决定化学反应速率与路径，其精准预测是计算化学核心挑战。近年生成式机器学习在小型有机反应中表现优异，但模型多训练于H、C、N、O等常见元素，对训练未见的新元素、过渡金属及新型催化环境的泛化能力缺乏系统评估。为此，研究人员构建了分布外过渡态新基准，并以Transition1x为基础开展验证，旨在全面检验模型在未知化学空间中的可靠性与鲁棒性，推动更普适、可迁移的过渡态预测方法发展。</p> <a class="cta" href="https://hub.baai.ac.cn/view/57156" target="_blank" rel="noopener noreferrer">
