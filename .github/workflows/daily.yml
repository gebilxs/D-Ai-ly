name: Hourly crawl and deploy

on:
  schedule:
    # Every hour (UTC) ≈ every hour in Asia/Shanghai
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  crawl-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check public homepage links (README / site)
        id: homepage_check
        run: python3 -m crawler.check_homepages
        continue-on-error: true

      - name: Deterministic crawl-endpoint health check
        id: source_check
        env:
          JIQIZHIXIN_COOKIE: ${{ secrets.JIQIZHIXIN_COOKIE }}
          MWEIBO_COOKIE: ${{ secrets.MWEIBO_COOKIE }}
        run: python3 -m crawler.check_sources
        continue-on-error: true

      - name: Upload link-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            crawler/homepage_check_report.json
            crawler/source_check_report.json
          if-no-files-found: ignore

      - name: Crawl today's sources
        # Never use demo fixtures in production — only real source URLs
        # Optional: repo Secret JIQIZHIXIN_COOKIE = browser Cookie header for 机器之心
        # Optional: repo Secret MWEIBO_COOKIE = logged-in m.weibo.cn cookie (weibo 432 anti-crawl)
        env:
          JIQIZHIXIN_COOKIE: ${{ secrets.JIQIZHIXIN_COOKIE }}
          MWEIBO_COOKIE: ${{ secrets.MWEIBO_COOKIE }}
        run: python3 -m crawler.run --date today
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Commit new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily crawl $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # Runs after deploy on purpose: a red run is the alert, deploys must
      # never be blocked by per-source emptiness.
      - name: Coverage report & alert
        run: python3 -m crawler.coverage

      - name: Upload coverage stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-stats
          path: crawler/stats.json
          if-no-files-found: ignore
