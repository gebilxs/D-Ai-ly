name: Daily crawl and deploy

on:
  schedule:
    # UTC 00:00 ≈ Asia/Shanghai 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  crawl-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Crawl today's sources
        if: github.event_name != 'push'
        run: python3 -m crawler.run --date today
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Commit new content
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily crawl $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Try enable Pages from gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
            exit 0
          fi
          # May fail if token lacks admin; then enable once in Settings UI
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
