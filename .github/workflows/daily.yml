name: Daily crawl and deploy

on:
  schedule:
    # UTC 00:00 ≈ Asia/Shanghai 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Crawl today's sources
        if: github.event_name != 'push'
        run: python3 -m crawler.run --date today
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Commit new content
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily crawl $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Ensure GitHub Pages site exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already configured"
          else
            echo "Creating Pages site (build_type=workflow)"
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
